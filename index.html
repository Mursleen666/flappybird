<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flappy Bird Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --px:'Press Start 2P',monospace;
  --neon-y:#f5e642;--neon-g:#39ff14;--neon-b:#00d4ff;--neon-p:#ff2d78;
}

body{
  background:#000;display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:100vh;font-family:var(--px);
  overflow:hidden;user-select:none;touch-action:none;
}

body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.12) 4px);
}

#wrapper{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}

/* ── TITLE ── */
#title-banner{
  color:var(--neon-y);font-size:20px;letter-spacing:3px;
  text-shadow:0 0 8px var(--neon-y),0 0 24px var(--neon-y),3px 3px 0 #8a7a00;
  animation:flicker 4s infinite;
}
@keyframes flicker{0%,94%,100%{opacity:1}95%{opacity:.4}96%{opacity:1}97%{opacity:.2}98%{opacity:1}}

/* ── FRAME ── */
#frame{
  position:relative;
  border:3px solid var(--neon-b);
  box-shadow:0 0 14px var(--neon-b),0 0 50px rgba(0,212,255,.25),inset 0 0 30px rgba(0,0,0,.5);
  border-radius:4px;overflow:hidden;
}
canvas{display:block;image-rendering:pixelated}

/* ── HUD ── */
#hud{
  position:absolute;top:12px;left:0;right:0;
  display:flex;justify-content:space-between;padding:0 16px;
  pointer-events:none;z-index:10;
}
.hud-col{display:flex;flex-direction:column}
.hud-label{font-size:7px;color:rgba(255,255,255,.45);text-shadow:1px 1px 0 #000;margin-bottom:3px}
.hud-val{font-size:16px;color:#fff;text-shadow:2px 2px 0 #000,0 0 10px rgba(255,255,255,.35)}
#hud-best{color:var(--neon-y);text-shadow:2px 2px 0 #000,0 0 10px var(--neon-y)}
#combo-hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);
  font-size:8px;color:var(--neon-p);text-shadow:0 0 8px var(--neon-p);
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:10;text-align:center}
#combo-hud.show{opacity:1}

/* ── SCREEN SHAKE ── */
#frame.shake{animation:shake .35s ease}
@keyframes shake{
  0%{transform:translate(0)}
  15%{transform:translate(-6px,4px)}
  30%{transform:translate(6px,-4px)}
  45%{transform:translate(-4px,2px)}
  60%{transform:translate(4px,-2px)}
  75%{transform:translate(-2px,1px)}
  100%{transform:translate(0)}
}

/* ── OVERLAY ── */
#overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;
  background:rgba(0,0,0,.78);z-index:20;border-radius:2px;
  transition:opacity .35s;
}
#overlay.hidden{opacity:0;pointer-events:none}

#ov-title{
  font-size:13px;color:var(--neon-y);
  text-shadow:0 0 14px var(--neon-y),2px 2px 0 #000;
  margin-bottom:18px;letter-spacing:1px;animation:pulse-txt 1.5s infinite;
}
@keyframes pulse-txt{0%,100%{text-shadow:0 0 14px var(--neon-y),2px 2px 0 #000}50%{text-shadow:0 0 28px var(--neon-y),0 0 60px var(--neon-y),2px 2px 0 #000}}

/* ── TABS ── */
#tabs{display:flex;gap:2px;margin-bottom:14px}
.tab{
  font-family:var(--px);font-size:7px;padding:7px 12px;
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.15);cursor:pointer;
  transition:all .15s;
}
.tab.active{background:rgba(0,212,255,.15);color:var(--neon-b);border-color:var(--neon-b);text-shadow:0 0 6px var(--neon-b)}

/* ── PANEL ── */
.panel{display:none;flex-direction:column;align-items:center;width:100%}
.panel.active{display:flex}

/* SCORE BOARD */
#score-board{
  background:rgba(255,255,255,.05);border:2px solid var(--neon-b);
  border-radius:4px;padding:14px 32px;margin-bottom:16px;text-align:center;
  box-shadow:0 0 16px rgba(0,212,255,.2);
}
#sb-score{font-size:30px;color:#fff;text-shadow:2px 2px 0 #000}
#sb-best{font-size:9px;color:var(--neon-y);margin-top:8px}
#sb-medal{font-size:28px;margin-top:8px}

/* SELECTOR GRID */
.selector-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;width:280px}
.sel-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 4px;background:rgba(255,255,255,.05);
  border:2px solid rgba(255,255,255,.1);border-radius:3px;
  cursor:pointer;transition:all .15s;
}
.sel-item:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.sel-item.selected{border-color:var(--neon-b);background:rgba(0,212,255,.12);box-shadow:0 0 10px rgba(0,212,255,.3)}
.sel-item canvas{image-rendering:pixelated}
.sel-label{font-size:5px;color:rgba(255,255,255,.55);text-align:center}

/* THEME SELECTOR */
.theme-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px;background:rgba(255,255,255,.05);
  border:2px solid rgba(255,255,255,.1);border-radius:3px;
  cursor:pointer;transition:all .15s;
}
.theme-item:hover{background:rgba(255,255,255,.1)}
.theme-item.selected{border-color:var(--neon-y);background:rgba(245,230,66,.1)}
.theme-preview{width:60px;height:40px;border-radius:2px;border:1px solid rgba(255,255,255,.1)}
.theme-label{font-size:5px;color:rgba(255,255,255,.55)}

/* BUTTONS */
#start-btn{
  font-family:var(--px);font-size:10px;padding:12px 30px;
  background:var(--neon-g);color:#000;border:none;border-radius:2px;
  cursor:pointer;box-shadow:0 0 16px var(--neon-g),3px 3px 0 #004d00;
  transition:transform .1s,box-shadow .1s;letter-spacing:1px;margin-top:6px;
}
#start-btn:hover{transform:scale(1.07);box-shadow:0 0 28px var(--neon-g),3px 3px 0 #004d00}
#start-btn:active{transform:scale(.96)}

#hint{margin-top:12px;font-size:6px;color:rgba(255,255,255,.35);letter-spacing:1px}
#footer{font-size:6px;color:rgba(255,255,255,.18);letter-spacing:1px}

/* ── SPEED BADGE ── */
#speed-badge{
  position:absolute;bottom:72px;right:8px;font-size:6px;
  color:var(--neon-p);text-shadow:0 0 6px var(--neon-p);
  opacity:0;transition:opacity .4s;pointer-events:none;z-index:10;
}
#speed-badge.show{opacity:1}
</style>
</head>
<body>
<div id="wrapper">
  <div id="title-banner">🐦 FLAPPY BIRD PRO</div>

  <div id="frame">
    <canvas id="c" width="360" height="540"></canvas>

    <div id="hud">
      <div class="hud-col"><div class="hud-label">SCORE</div><div class="hud-val" id="hud-score">0</div></div>
      <div class="hud-col" style="align-items:flex-end"><div class="hud-label">BEST</div><div class="hud-val" id="hud-best">0</div></div>
    </div>
    <div id="combo-hud"></div>
    <div id="speed-badge">⚡ SPEED UP!</div>

    <div id="overlay">
      <div id="ov-title">READY?</div>
      <div id="tabs">
        <div class="tab active" data-tab="play">PLAY</div>
        <div class="tab" data-tab="bird">BIRD</div>
        <div class="tab" data-tab="theme">WORLD</div>
      </div>

      <!-- PLAY PANEL -->
      <div class="panel active" id="panel-play">
        <div id="score-board">
          <div id="sb-score">0</div>
          <div id="sb-best">BEST: 0</div>
          <div id="sb-medal"></div>
        </div>
        <button id="start-btn">▶ START</button>
        <div id="hint">SPACE / TAP to flap</div>
      </div>

      <!-- BIRD PANEL -->
      <div class="panel" id="panel-bird">
        <div style="font-size:7px;color:rgba(255,255,255,.4);margin-bottom:10px">CHOOSE YOUR BIRD</div>
        <div class="selector-grid" id="bird-grid"></div>
      </div>

      <!-- THEME PANEL -->
      <div class="panel" id="panel-theme">
        <div style="font-size:7px;color:rgba(255,255,255,.4);margin-bottom:10px">CHOOSE YOUR WORLD</div>
        <div class="selector-grid" id="theme-grid"></div>
      </div>
    </div>
  </div>
  <div id="footer">SPACE / TAP TO FLAP</div>
</div>

<script>
(() => {
'use strict';

// ─────────────────────────────────────────────
//  CANVAS SETUP
// ─────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const frame   = document.getElementById('frame');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ov-title');
const sbScore = document.getElementById('sb-score');
const sbBest  = document.getElementById('sb-best');
const sbMedal = document.getElementById('sb-medal');
const startBtn= document.getElementById('start-btn');
const hudScore= document.getElementById('hud-score');
const hudBest = document.getElementById('hud-best');
const combHud = document.getElementById('combo-hud');
const speedBadge = document.getElementById('speed-badge');

// ─────────────────────────────────────────────
//  CONSTANTS
// ─────────────────────────────────────────────
const GRAVITY       = 0.36;
const FLAP_VEL      = -7.0;
const PIPE_W        = 54;
const PIPE_GAP_BASE = 152;
const PIPE_SPEED_BASE= 2.5;
const PIPE_INTERVAL = 1650;
const GROUND_H      = 64;
const BIRD_R        = 13;
const DIFFICULTY_STEP = 5; // score intervals to increase difficulty

// ─────────────────────────────────────────────
//  THEMES
// ─────────────────────────────────────────────
const THEMES = [
  {
    id:'night', name:'NIGHT CITY',
    skyTop:'#0d0d1a', skyMid:'#0f2240', skyBot:'#1a3a60',
    groundTop:'#c8860a', groundMid:'#a06a06', groundBot:'#5a3a00',
    grassTop:'#4caf1a', grassBump:'#5dcc22',
    pipeGrad:['#1a7a00','#39ff14','#39ff14','#0d5500'],
    pipeCap:'#39ff14', pipeCapBorder:'#00b300',
    pipeGlow:'#39ff14', groundLine:'#39ff14',
    stars:true, clouds:false, city:true,
  },
  {
    id:'sunset', name:'SUNSET',
    skyTop:'#1a0533', skyMid:'#7b1c3e', skyBot:'#f28b30',
    groundTop:'#8b4513', groundMid:'#6b3410', groundBot:'#3d1f08',
    grassTop:'#2d6e12', grassBump:'#3a8a18',
    pipeGrad:['#8b0000','#ff4444','#ff4444','#5a0000'],
    pipeCap:'#ff4444', pipeCapBorder:'#990000',
    pipeGlow:'#ff6622', groundLine:'#ff9944',
    stars:false, clouds:true, city:false,
  },
  {
    id:'space', name:'DEEP SPACE',
    skyTop:'#000005', skyMid:'#03001e', skyBot:'#06003a',
    groundTop:'#2a2a3a', groundMid:'#1e1e2e', groundBot:'#0d0d1e',
    grassTop:'#4a3a6a', grassBump:'#5a4a7a',
    pipeGrad:['#001a4d','#00d4ff','#00d4ff','#000d26'],
    pipeCap:'#00d4ff', pipeCapBorder:'#0088aa',
    pipeGlow:'#00d4ff', groundLine:'#8844ff',
    stars:true, clouds:false, city:false, nebula:true,
  },
  {
    id:'forest', name:'FOREST',
    skyTop:'#0a1f0a', skyMid:'#0d2e0d', skyBot:'#1a4a1a',
    groundTop:'#3d2b1f', groundMid:'#2a1c0f', groundBot:'#1a100a',
    grassTop:'#1a5c1a', grassBump:'#227722',
    pipeGrad:['#0d3300','#22aa22','#22aa22','#082200'],
    pipeCap:'#33cc33', pipeCapBorder:'#117711',
    pipeGlow:'#33ff33', groundLine:'#44ff44',
    stars:false, clouds:true, city:false, trees:true,
  },
];

// ─────────────────────────────────────────────
//  BIRD SKINS
// ─────────────────────────────────────────────
const BIRDS = [
  {id:'yellow', name:'CLASSIC',   body:['#ffe066','#f5c800','#c89000'], wing:'#e0a800', beak:'#ff8c00', eye:'#111'},
  {id:'red',    name:'ANGRY',     body:['#ff6655','#e83030','#a01010'], wing:'#c02020', beak:'#ff9922', eye:'#1a0000'},
  {id:'blue',   name:'COOL',      body:['#66aaff','#3388ff','#1155cc'], wing:'#2266cc', beak:'#ffcc00', eye:'#002244'},
  {id:'green',  name:'TOXIC',     body:['#88ff44','#44cc00','#228800'], wing:'#33aa00', beak:'#ffee00', eye:'#002200'},
  {id:'pink',   name:'FLAMINGO',  body:['#ff88cc','#ff44aa','#cc1177'], wing:'#dd2299', beak:'#ff6600', eye:'#330011'},
  {id:'white',  name:'GHOST',     body:['#ffffff','#dddddd','#aaaaaa'], wing:'#cccccc', beak:'#ff8800', eye:'#222222'},
  {id:'gold',   name:'GOLDEN',    body:['#ffd700','#ffaa00','#cc8800'], wing:'#cc9900', beak:'#cc4400', eye:'#442200'},
  {id:'dark',   name:'MIDNIGHT',  body:['#553399','#331177','#110044'], wing:'#220055', beak:'#8844ff', eye:'#bbaaff'},
];

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let state = 'idle';
let score = 0, combo = 0, comboTimer = 0;
let best = parseInt(localStorage.getItem('fb_best') || '0');
let selectedBird  = parseInt(localStorage.getItem('fb_bird')  || '0');
let selectedTheme = parseInt(localStorage.getItem('fb_theme') || '0');

let bird = {}, pipes = [], stars = [], clouds = [], particles = [], trees = [];
let groundOffset = 0, lastPipe = 0, lastTime = 0;
let pipeSpeed = PIPE_SPEED_BASE, pipeGap = PIPE_GAP_BASE;
let lastDiffScore = 0;

// ─────────────────────────────────────────────
//  AUDIO (Web Audio API)
// ─────────────────────────────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, type, dur, gain=0.3) {
  try {
    const ac = getAudio();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
    g.gain.setValueAtTime(gain, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e){}
}
function sfxFlap()  { playTone(520, 'sine',  .08, .18); playTone(680, 'sine', .05, .1); }
function sfxScore() { playTone(880, 'sine', .1, .2); setTimeout(()=>playTone(1100,'sine',.1,.2),80); }
function sfxCombo() { playTone(1320,'sine',.12,.25); setTimeout(()=>playTone(1760,'sine',.15,.25),100); }
function sfxDeath() {
  playTone(200,'sawtooth',.15,.3);
  setTimeout(()=>playTone(160,'sawtooth',.15,.3),100);
  setTimeout(()=>playTone(120,'sawtooth',.25,.3),200);
}
function sfxSpeedUp(){ playTone(660,'square',.08,.2); setTimeout(()=>playTone(880,'square',.12,.2),80); }

// ─────────────────────────────────────────────
//  STAR / CLOUD / TREE INIT
// ─────────────────────────────────────────────
function initStars() {
  stars = Array.from({length:80}, () => ({
    x: Math.random()*W, y: Math.random()*(H-GROUND_H-40),
    r: Math.random()*1.8+.4, speed: Math.random()*.4+.05, alpha: Math.random()*Math.PI*2
  }));
}
function initClouds() {
  clouds = Array.from({length:6}, (_,i) => ({
    x: i*(W/5), y: 30 + Math.random()*80,
    w: 60+Math.random()*60, h: 22+Math.random()*18,
    speed: .3+Math.random()*.3
  }));
}
function initTrees() {
  trees = Array.from({length:8}, (_,i) => ({
    x: i*(W/7+10)+Math.random()*20,
    h: 60+Math.random()*80, w: 18+Math.random()*12,
    speed:.8, dark: Math.random()>.5
  }));
}

// ─────────────────────────────────────────────
//  BIRD
// ─────────────────────────────────────────────
function resetBird() {
  bird = { x:80, y:H/2, vy:0, angle:0, frameTick:0, dead:false, squish:1 };
}

// ─────────────────────────────────────────────
//  PIPES
// ─────────────────────────────────────────────
function spawnPipe() {
  const min=70, max=H-GROUND_H-pipeGap-70;
  const topH = Math.floor(Math.random()*(max-min)+min);
  pipes.push({x:W+10, topH, scored:false});
}

// ─────────────────────────────────────────────
//  PARTICLES
// ─────────────────────────────────────────────
function spawnFlapParticles() {
  const brd = BIRDS[selectedBird];
  for (let i=0;i<7;i++) {
    particles.push({
      x:bird.x-12, y:bird.y,
      vx:-Math.random()*3-.5, vy:(Math.random()-.5)*2.5,
      life:1, decay:Math.random()*.07+.04,
      r:Math.random()*4+2, hue:Math.random()>.5 ? brd.body[0] : '#fff'
    });
  }
}
function spawnScoreParticles() {
  for (let i=0;i<12;i++) {
    const angle = (Math.PI*2*i)/12;
    particles.push({
      x:bird.x+30, y:bird.y,
      vx:Math.cos(angle)*3, vy:Math.sin(angle)*3-1,
      life:1, decay:.04, r:3+Math.random()*3,
      hue:['#f5e642','#fff','#00d4ff'][Math.floor(Math.random()*3)]
    });
  }
}
function spawnDeathParticles() {
  const brd = BIRDS[selectedBird];
  for (let i=0;i<28;i++) {
    const angle = (Math.PI*2*i)/28;
    const speed = Math.random()*7+3;
    particles.push({
      x:bird.x, y:bird.y,
      vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-1,
      life:1, decay:.018, r:Math.random()*7+3,
      hue:[brd.body[0],brd.body[1],'#ff2d78','#fff'][Math.floor(Math.random()*4)]
    });
  }
}
function spawnComboParticles() {
  for (let i=0;i<20;i++) {
    particles.push({
      x:bird.x+Math.random()*60-30, y:bird.y+Math.random()*40-20,
      vx:(Math.random()-.5)*5, vy:Math.random()*-5-1,
      life:1, decay:.03, r:4+Math.random()*5,
      hue:['#ff2d78','#f5e642','#39ff14','#00d4ff'][Math.floor(Math.random()*4)]
    });
  }
}

// ─────────────────────────────────────────────
//  DRAW
// ─────────────────────────────────────────────
function drawSky() {
  const t = THEMES[selectedTheme];
  const g = ctx.createLinearGradient(0,0,0,H-GROUND_H);
  g.addColorStop(0,  t.skyTop);
  g.addColorStop(.5, t.skyMid);
  g.addColorStop(1,  t.skyBot);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H-GROUND_H);
}

function drawNebula() {
  // purple nebula blob for space theme
  const g1=ctx.createRadialGradient(W*.3,H*.25,10,W*.3,H*.25,120);
  g1.addColorStop(0,'rgba(120,40,200,.18)'); g1.addColorStop(1,'transparent');
  ctx.fillStyle=g1; ctx.fillRect(0,0,W,H);
  const g2=ctx.createRadialGradient(W*.75,H*.5,10,W*.75,H*.5,100);
  g2.addColorStop(0,'rgba(0,180,255,.12)'); g2.addColorStop(1,'transparent');
  ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
}

function drawStars(dt) {
  stars.forEach(s => {
    s.alpha += s.speed*dt*.0008;
    const a = (Math.sin(s.alpha)+1)/2;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${a*.85+.1})`;
    ctx.fill();
  });
}

function drawClouds(dt) {
  const t = THEMES[selectedTheme];
  const isForest = t.id==='forest';
  clouds.forEach(c => {
    if (state==='playing') c.x -= c.speed;
    if (c.x + c.w < 0) c.x = W + c.w;
    const alpha = isForest ? .07 : .18;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w/2, c.h/2, 0, 0, Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x-c.w*.2, c.y+4, c.w*.3, c.h*.45, 0, 0, Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${alpha*.8})`;
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x+c.w*.2, c.y+2, c.w*.28, c.h*.4, 0, 0, Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${alpha*.8})`;
    ctx.fill();
  });
}

function drawCity() {
  // silhouette of city buildings
  const buildings = [
    {x:0,  w:40, h:90},{x:40, w:30, h:130},{x:70, w:50, h:80},
    {x:120,w:25, h:110},{x:145,w:45, h:70},{x:190,w:30, h:140},
    {x:220,w:55, h:85},{x:275,w:35, h:120},{x:310,w:50, h:95},
  ];
  const gy = H-GROUND_H;
  buildings.forEach(b => {
    ctx.fillStyle='rgba(0,0,0,.55)';
    ctx.fillRect(b.x, gy-b.h, b.w, b.h);
    // windows
    for (let wx=b.x+4;wx<b.x+b.w-4;wx+=8) {
      for (let wy=gy-b.h+6;wy<gy-8;wy+=10) {
        if (Math.random()>.4) {
          ctx.fillStyle=`rgba(255,220,80,${Math.random()*.4+.05})`;
          ctx.fillRect(wx,wy,4,5);
        }
      }
    }
  });
}

function drawTrees() {
  const t = THEMES[selectedTheme];
  const gy = H-GROUND_H;
  trees.forEach(tr => {
    if (state==='playing') { tr.x -= tr.speed; if (tr.x+tr.w<0) tr.x=W+tr.w; }
    // trunk
    ctx.fillStyle='rgba(30,15,5,.8)';
    ctx.fillRect(tr.x+tr.w/2-4, gy-tr.h*.4, 8, tr.h*.4);
    // canopy layers
    const c1 = tr.dark ? 'rgba(10,40,10,.85)' : 'rgba(20,80,20,.75)';
    const c2 = tr.dark ? 'rgba(5,25,5,.85)' : 'rgba(12,55,12,.8)';
    ctx.beginPath();
    ctx.moveTo(tr.x, gy-tr.h*.45);
    ctx.lineTo(tr.x+tr.w/2, gy-tr.h);
    ctx.lineTo(tr.x+tr.w, gy-tr.h*.45);
    ctx.closePath(); ctx.fillStyle=c1; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(tr.x+4, gy-tr.h*.65);
    ctx.lineTo(tr.x+tr.w/2, gy-tr.h-20);
    ctx.lineTo(tr.x+tr.w-4, gy-tr.h*.65);
    ctx.closePath(); ctx.fillStyle=c2; ctx.fill();
  });
}

function drawGround(offset) {
  const t = THEMES[selectedTheme];
  const gy = H-GROUND_H;
  const gr = ctx.createLinearGradient(0,gy,0,H);
  gr.addColorStop(0, t.groundTop); gr.addColorStop(.3, t.groundMid); gr.addColorStop(1, t.groundBot);
  ctx.fillStyle=gr; ctx.fillRect(0,gy,W,GROUND_H);

  ctx.fillStyle=t.grassTop; ctx.fillRect(0,gy,W,10);

  ctx.fillStyle=t.grassBump;
  const bW=12, cnt=Math.ceil(W/bW)+2;
  const off = -(offset%(bW*2));
  for (let i=0;i<cnt;i++) ctx.fillRect(off+i*bW, gy-3, 6, 3);

  ctx.strokeStyle=t.groundLine; ctx.lineWidth=1.5;
  ctx.shadowColor=t.groundLine; ctx.shadowBlur=5;
  ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
  ctx.shadowBlur=0;
}

function drawPipe(p) {
  const t = THEMES[selectedTheme];
  const botY = p.topH + pipeGap;

  ctx.shadowColor=t.pipeGlow; ctx.shadowBlur=12;

  const tg = ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
  t.pipeGrad.forEach((c,i)=>tg.addColorStop(i/3,c));

  // top pipe body
  ctx.fillStyle=tg; ctx.fillRect(p.x,0,PIPE_W,p.topH);
  ctx.strokeStyle=t.pipeCapBorder; ctx.lineWidth=2; ctx.strokeRect(p.x,0,PIPE_W,p.topH);
  // top cap
  ctx.fillStyle=t.pipeCap; ctx.fillRect(p.x-5,p.topH-22,PIPE_W+10,22);
  ctx.strokeStyle=t.pipeCapBorder; ctx.lineWidth=2; ctx.strokeRect(p.x-5,p.topH-22,PIPE_W+10,22);

  // bottom pipe body
  ctx.fillStyle=tg; ctx.fillRect(p.x,botY,PIPE_W,H-botY-GROUND_H);
  ctx.strokeStyle=t.pipeCapBorder; ctx.lineWidth=2; ctx.strokeRect(p.x,botY,PIPE_W,H-botY-GROUND_H);
  // bottom cap
  ctx.fillStyle=t.pipeCap; ctx.fillRect(p.x-5,botY,PIPE_W+10,22);
  ctx.strokeStyle=t.pipeCapBorder; ctx.strokeRect(p.x-5,botY,PIPE_W+10,22);

  // highlight
  ctx.fillStyle='rgba(255,255,255,.1)';
  ctx.fillRect(p.x+7,0,8,p.topH);
  ctx.fillRect(p.x+7,botY+22,8,H-botY-GROUND_H);

  ctx.shadowBlur=0;
}

function drawBirdCanvas(cx, brd, scale=1) {
  // used for both game and selector previews
  cx.save(); cx.scale(scale,scale);
  const r = BIRD_R;
  // squish effect
  const sq = bird.squish || 1;

  const bg = cx.createRadialGradient(-4,-4,2,0,0,r+4);
  bg.addColorStop(0, brd.body[0]); bg.addColorStop(.6, brd.body[1]); bg.addColorStop(1, brd.body[2]);
  cx.beginPath(); cx.ellipse(0,0,r+4,r+2,0,0,Math.PI*2);
  cx.fillStyle=bg; cx.fill();

  // wing (animate only in game)
  const wingY = (bird.frameTick||0)<8 ? 4 : -4;
  cx.beginPath(); cx.ellipse(-4,wingY,9,6,-0.3,0,Math.PI*2);
  cx.fillStyle=brd.wing; cx.fill();

  // tail
  cx.beginPath();
  cx.moveTo(-r-2,0); cx.lineTo(-r-8,-5); cx.lineTo(-r-8,5); cx.closePath();
  cx.fillStyle=brd.wing; cx.fill();

  // cheek blush
  cx.beginPath(); cx.arc(4,2,4,0,Math.PI*2);
  cx.fillStyle='rgba(255,150,150,.25)'; cx.fill();

  // eye white
  cx.beginPath(); cx.arc(6,-5,5,0,Math.PI*2); cx.fillStyle='#fff'; cx.fill();
  // pupil
  cx.beginPath(); cx.arc(7.5,-5,2.5,0,Math.PI*2); cx.fillStyle=brd.eye; cx.fill();
  // glint
  cx.beginPath(); cx.arc(8.5,-6,1,0,Math.PI*2); cx.fillStyle='#fff'; cx.fill();

  // beak
  cx.beginPath();
  cx.moveTo(r+2,-3); cx.lineTo(r+10,0); cx.lineTo(r+2,3); cx.closePath();
  cx.fillStyle=brd.beak; cx.fill();
  cx.strokeStyle='rgba(0,0,0,.2)'; cx.lineWidth=.5; cx.stroke();

  // glow outline
  cx.beginPath(); cx.ellipse(0,0,r+4,r+2,0,0,Math.PI*2);
  cx.strokeStyle=`${brd.body[0]}99`; cx.lineWidth=2;
  cx.shadowColor=brd.body[1]; cx.shadowBlur=12; cx.stroke();
  cx.shadowBlur=0;
  cx.restore();
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.angle);
  // squish on flap
  const sq = bird.squish;
  ctx.scale(1/sq, sq);
  drawBirdCanvas(ctx, BIRDS[selectedBird]);
  ctx.restore();

  // fade squish back
  if (bird.squish > 1) bird.squish = Math.max(1, bird.squish - .04);
  if (bird.squish < 1) bird.squish = Math.min(1, bird.squish + .04);
}

function drawParticles() {
  particles.forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(.1,p.r*p.life),0,Math.PI*2);
    ctx.fillStyle=p.hue; ctx.globalAlpha=p.life; ctx.fill();
  });
  ctx.globalAlpha=1;
}

// floating +1 text
let floaters = [];
function spawnFloater(text, x, y, color='#f5e642') {
  floaters.push({text, x, y, life:1, vy:-1.2, color});
}
function drawFloaters() {
  floaters.forEach(f=>{
    ctx.globalAlpha=f.life;
    ctx.fillStyle=f.color;
    ctx.font=`8px 'Press Start 2P'`;
    ctx.textAlign='center';
    ctx.fillText(f.text, f.x, f.y);
    ctx.textAlign='left';
    f.y+=f.vy; f.life-=.025;
  });
  ctx.globalAlpha=1;
  floaters=floaters.filter(f=>f.life>0);
}

// ─────────────────────────────────────────────
//  COMBO SYSTEM
// ─────────────────────────────────────────────
let comboHudTimeout = null;
function updateCombo() {
  combo++;
  if (combo>=3) {
    const txt = combo>=10 ? `×${combo} INSANE!!` : combo>=7 ? `×${combo} AMAZING!` : combo>=5 ? `×${combo} GREAT!` : `×${combo} COMBO!`;
    combHud.textContent=txt;
    combHud.classList.add('show');
    clearTimeout(comboHudTimeout);
    comboHudTimeout=setTimeout(()=>combHud.classList.remove('show'),900);
    if (combo===5||combo===10) { sfxCombo(); spawnComboParticles(); }
    spawnFloater(`×${combo}`, bird.x+40, bird.y-20, '#ff2d78');
  } else {
    spawnFloater('+1', bird.x+30, bird.y-20);
  }
}
function resetCombo() { combo=0; combHud.classList.remove('show'); }

// ─────────────────────────────────────────────
//  DIFFICULTY SCALING
// ─────────────────────────────────────────────
function updateDifficulty() {
  const level = Math.floor(score/DIFFICULTY_STEP);
  const newSpeed = PIPE_SPEED_BASE + level*0.22;
  const newGap   = Math.max(110, PIPE_GAP_BASE - level*5);
  if (newSpeed > pipeSpeed + .01) {
    pipeSpeed = newSpeed;
    pipeGap   = newGap;
    sfxSpeedUp();
    speedBadge.classList.add('show');
    setTimeout(()=>speedBadge.classList.remove('show'), 1200);
    spawnFloater('⚡ FASTER!', W/2, H/2-30, '#ff2d78');
  }
}

// ─────────────────────────────────────────────
//  MEDALS
// ─────────────────────────────────────────────
function getMedal(s) {
  if (s>=50) return '🏆';
  if (s>=30) return '🥇';
  if (s>=15) return '🥈';
  if (s>=5)  return '🥉';
  return '';
}

// ─────────────────────────────────────────────
//  COLLISION
// ─────────────────────────────────────────────
function killBird() {
  if (bird.dead) return;
  bird.dead=true; state='dead';
  sfxDeath();
  spawnDeathParticles();
  resetCombo();
  frame.classList.add('shake');
  setTimeout(()=>frame.classList.remove('shake'), 400);
  if (score>best) { best=score; localStorage.setItem('fb_best',best); }
  setTimeout(()=>{
    ovTitle.textContent = score>0 ? 'GAME OVER' : 'OOPS!';
    startBtn.textContent='↩ RETRY';
    sbScore.textContent=score;
    sbBest.textContent='BEST: '+best;
    sbMedal.textContent=getMedal(score);
    hudScore.textContent=score; hudBest.textContent=best;
    overlay.classList.remove('hidden');
    // auto-switch to play tab
    switchTab('play');
  }, 850);
}

// ─────────────────────────────────────────────
//  INPUT
// ─────────────────────────────────────────────
function flap() {
  if (state!=='playing') return;
  bird.vy=FLAP_VEL;
  bird.squish=1.35;
  sfxFlap();
  spawnFlapParticles();
}

document.addEventListener('keydown', e=>{
  if (e.code==='Space'||e.key==='ArrowUp') { e.preventDefault(); flap(); }
});
canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); flap(); });

startBtn.addEventListener('click', startGame);
startBtn.addEventListener('touchstart', e=>{ e.preventDefault(); startGame(); },{passive:false});

// ─────────────────────────────────────────────
//  GAME LOOP
// ─────────────────────────────────────────────
function loop(ts) {
  const dt = Math.min(ts-lastTime, 50);
  lastTime=ts;
  ctx.clearRect(0,0,W,H);

  const t=THEMES[selectedTheme];

  drawSky();
  if (t.nebula) drawNebula();
  if (t.stars)  drawStars(dt);
  if (t.clouds) drawClouds(dt);
  if (t.city)   drawCity();
  if (t.trees)  drawTrees();

  if (state==='playing') {
    bird.vy   += GRAVITY;
    bird.y    += bird.vy;
    bird.angle = Math.max(-0.42, Math.min(Math.PI/2.1, bird.vy*0.055));
    bird.frameTick = (bird.frameTick+1)%16;
    groundOffset += pipeSpeed;

    if (ts-lastPipe > PIPE_INTERVAL/Math.max(1,(pipeSpeed/PIPE_SPEED_BASE)*.85)) {
      spawnPipe(); lastPipe=ts;
    }
    pipes.forEach(p=>{ p.x-=pipeSpeed; });
    pipes=pipes.filter(p=>p.x+PIPE_W+10>0);

    // scoring
    pipes.forEach(p=>{
      if (!p.scored && p.x+PIPE_W < bird.x) {
        p.scored=true; score++;
        if (score>best) best=score;
        sfxScore();
        updateCombo();
        updateDifficulty();
        hudScore.textContent=score; hudBest.textContent=best;
        spawnScoreParticles();
      }
    });

    // ground collision
    if (bird.y+BIRD_R >= H-GROUND_H) { bird.y=H-GROUND_H-BIRD_R; killBird(); }
    // ceiling
    if (bird.y-BIRD_R <= 0) { bird.y=BIRD_R; bird.vy=0; }
    // pipe collision
    pipes.forEach(p=>{
      const r=BIRD_R-2;
      if (bird.x+r>p.x && bird.x-r<p.x+PIPE_W) {
        if (bird.y-r<p.topH || bird.y+r>p.topH+pipeGap) killBird();
      }
    });

    // update particles
    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.12; p.life-=p.decay; });
    particles=particles.filter(p=>p.life>0);
  }

  pipes.forEach(drawPipe);
  drawGround(groundOffset);
  drawBird();
  drawParticles();
  drawFloaters();

  requestAnimationFrame(loop);
}

// ─────────────────────────────────────────────
//  START
// ─────────────────────────────────────────────
function startGame() {
  score=0; combo=0;
  pipes=[]; particles=[]; floaters=[];
  groundOffset=0; lastPipe=0;
  pipeSpeed=PIPE_SPEED_BASE; pipeGap=PIPE_GAP_BASE;
  lastDiffScore=0;
  resetBird(); resetCombo();
  hudScore.textContent='0'; hudBest.textContent=best;
  overlay.classList.add('hidden');
  state='playing';
  lastPipe=performance.now();
  setTimeout(spawnPipe, 900);
}

// ─────────────────────────────────────────────
//  TABS
// ─────────────────────────────────────────────
function switchTab(id) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id));
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>switchTab(t.dataset.tab));
});

// ─────────────────────────────────────────────
//  BIRD SELECTOR
// ─────────────────────────────────────────────
function buildBirdGrid() {
  const grid=document.getElementById('bird-grid');
  BIRDS.forEach((brd,i)=>{
    const item=document.createElement('div');
    item.className='sel-item'+(i===selectedBird?' selected':'');

    const c=document.createElement('canvas');
    c.width=46; c.height=46;
    const cx=c.getContext('2d');
    cx.translate(20,22);
    // static preview (no animation)
    const fakeBird={frameTick:0, squish:1};
    const savedBird=bird;
    bird=fakeBird;
    drawBirdCanvas(cx, brd);
    bird=savedBird;

    const lbl=document.createElement('div');
    lbl.className='sel-label'; lbl.textContent=brd.name;

    item.appendChild(c); item.appendChild(lbl);
    item.addEventListener('click',()=>{
      selectedBird=i;
      localStorage.setItem('fb_bird',i);
      grid.querySelectorAll('.sel-item').forEach((el,j)=>el.classList.toggle('selected',j===i));
    });
    grid.appendChild(item);
  });
}

// ─────────────────────────────────────────────
//  THEME SELECTOR
// ─────────────────────────────────────────────
function buildThemeGrid() {
  const grid=document.getElementById('theme-grid');
  THEMES.forEach((th,i)=>{
    const item=document.createElement('div');
    item.className='sel-item'+(i===selectedTheme?' selected':'');

    const c=document.createElement('canvas');
    c.width=56; c.height=40;
    const cx=c.getContext('2d');
    // mini sky
    const g=cx.createLinearGradient(0,0,0,40);
    g.addColorStop(0,th.skyTop); g.addColorStop(.6,th.skyMid); g.addColorStop(1,th.skyBot);
    cx.fillStyle=g; cx.fillRect(0,0,56,40);
    // mini ground
    cx.fillStyle=th.grassTop; cx.fillRect(0,32,56,8);
    // mini pipe
    cx.fillStyle=th.pipeCap; cx.fillRect(28,10,10,22); cx.fillRect(25,26,16,6);
    if (th.stars) {
      cx.fillStyle='rgba(255,255,255,.7)';
      [[5,5],[15,12],[40,4],[50,15],[8,22]].forEach(([x,y])=>{
        cx.beginPath(); cx.arc(x,y,1,0,Math.PI*2); cx.fill();
      });
    }

    const lbl=document.createElement('div');
    lbl.className='sel-label'; lbl.textContent=th.name;

    item.appendChild(c); item.appendChild(lbl);
    item.addEventListener('click',()=>{
      selectedTheme=i;
      localStorage.setItem('fb_theme',i);
      grid.querySelectorAll('.sel-item').forEach((el,j)=>el.classList.toggle('selected',j===i));
    });
    grid.appendChild(item);
  });
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
initStars(); initClouds(); initTrees();
resetBird();
buildBirdGrid();
buildThemeGrid();
lastTime=performance.now();
requestAnimationFrame(loop);

ovTitle.textContent='READY?';
startBtn.textContent='▶ START';
sbScore.textContent='0';
sbBest.textContent='BEST: '+best;
sbMedal.textContent='';
hudBest.textContent=best;

})();
</script>
</body>
</html>
